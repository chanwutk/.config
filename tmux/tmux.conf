# Stable HPC tmux configuration. Keep this as the only auto-loaded config.
set -g default-command "${SHELL}"

# Advertise tmux's own terminfo inside panes and the outer terminal's true-color
# support to tmux. Applications must be allowed to choose TERM themselves.
set -s default-terminal "tmux-256color"
set -s escape-time 50
set -su terminal-features
set -as terminal-features ",xterm-256color:RGB"
set -su terminal-overrides
set -g alternate-screen on
set -g mouse on
set -g focus-events on
set -g history-limit 500000

# Compact, stable status bar. Codex manages its own in-app status line.
set -g status on
set -g status-position bottom
set -g status-interval 15
set -g status-left "#[fg=terminal,bg=terminal,bold]#S#[nobold] "
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format "#[fg=colour22]▏#I:#W▕#[default]"
set -g window-status-current-format "#[fg=colour15,bg=colour22,bold] #I:#W #[default,nobold]"
set -g status-justify left

# Follow application terminal titles without a polling watcher process.
set-window-option -g allow-rename on
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{pane_title}"
